hostname BRANCH-8
username admin privilege 15 role network-admin secret admin
ip routing
!
interface Ethernet1
   description uplink to HUB-2
   mtu 1500
   no switchport
   ip address 10.0.22.0/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Loopback0
   ip address 1.1.1.12/32
   ip ospf area 0.0.0.0
!
interface Loopback1
   description branch LAN gateway
   ip address 10.30.30.1/24
   ip ospf area 0.0.0.0
!
router ospf 1
   router-id 1.1.1.12
   log-adjacency-changes detail
!
management api http-commands
   protocol http
   no shutdown
