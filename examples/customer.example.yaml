# kit/examples/customer.example.yaml -- copy to customers/<name>.yaml (private repo) and edit.
name: example-corp
requester: presenter                       # whoever runs the demo; they can never approve
branding: {title: "Example Corp NetOps agent team", accent: "#0f766e"}
naming: {BRANCH-7: LYON-BR07, HUB-1: PAR-HUB01, BRANCH-8: LYON-BR08, HUB-2: PAR-HUB02}
scenario: ospf_area_mismatch
mode: simulated                            # simulated | lab
inventory: {adapter: netbox_export}        # rendered from the topology in this plan; a file path in Plan 4b
evidence: [{adapter: device_logs}, {adapter: mock_splunk}]
approval: {adapter: mock_servicenow, approver: "Camille Durand"}
audit: [{adapter: memory}, {adapter: mock_confluence, space: NETOPS}]
llm: {adapter: mock}                       # or {adapter: openai_compat, base_url: ${NETOPS_BASE_URL}, model: ${NETOPS_MODEL}, fallback: mock}
